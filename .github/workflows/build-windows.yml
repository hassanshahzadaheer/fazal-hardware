name: Build Windows TEST installer (not for customers)

# Manual, unsigned smoke-test build with dev defaults (licence URL = localhost). It never
# publishes anything. Real releases come only from release.yml (tag push).

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run package -- --win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-TEST-ONLY
          path: release/*.exe
